[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "type-fast"
version = "0.1.0"
description = "A simple macOS input tool that translates typed text between many languages (English, Japanese, Chinese, Korean, Spanish, and more) using the OpenAI API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xiang Wang" }]
keywords = ["translation", "openai", "macos", "japanese", "multilingual", "pyside6"]
classifiers = [
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "openai>=1.40.0",
    "PySide6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/wangx173/type-fast"
Repository = "https://github.com/wangx173/type-fast"
Issues = "https://github.com/wangx173/type-fast/issues"

[project.scripts]
type-fast = "type_fast.app:main"

[tool.setuptools]
packages = ["type_fast", "type_fast.providers"]

[tool.setuptools.package-data]
type_fast = ["resources/*.png"]
