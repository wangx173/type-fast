name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import check
        run: |
          python -c "
          import type_fast.app, type_fast.translator, type_fast.config
          import type_fast.accessibility, type_fast.focus, type_fast.hotkey
          import type_fast.ax_focus
          print('imports OK')
          "

      - name: Headless window smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from type_fast.app import MainWindow
          app = QApplication([])
          w = MainWindow()
          assert w.windowTitle() == "Type Fast"
          assert w.direction.count() == 2
          # Hotkey monitor installs even without Accessibility trust; it just
          # won't receive events until the user grants access.
          assert w._hotkey_active is True
          assert w._previous_ax_element is None
          assert w._live_inject_supported is False
          w._hotkey.stop()
          print("window OK")
          PY

      - name: Accessibility/hotkey module smoke test
        run: |
          python - <<'PY'
          from type_fast import accessibility
          from type_fast.hotkey import GlobalHotkey, _DEFAULT_MODIFIER_MASK, _KEYCODE_SPACE

          # These APIs must never raise, even when the process is untrusted
          # (the CI runner never grants Accessibility access).
          assert isinstance(accessibility.is_trusted(), bool)
          # prompt_for_trust()'s actual contract is "never raises" — its
          # return value can vary across environments (e.g. this CI runner
          # behaves differently from a real desktop), so only assert the
          # type, not a specific untrusted-by-default value.
          assert isinstance(accessibility.prompt_for_trust(), bool)

          # GlobalHotkey's matching logic should fire only on the exact
          # configured chord, without needing a real event tap installed.
          class FakeEvent:
              def __init__(self, key_code, modifier_flags):
                  self._key_code = key_code
                  self._modifier_flags = modifier_flags

              def keyCode(self):
                  return self._key_code

              def modifierFlags(self):
                  return self._modifier_flags

          triggered = []
          hk = GlobalHotkey(lambda: triggered.append(True))

          # start() is idempotent: calling it again while already running
          # still reports success instead of False.
          assert hk.start() is True
          assert hk.start() is True

          hk._handle_event(FakeEvent(_KEYCODE_SPACE, _DEFAULT_MODIFIER_MASK))
          assert triggered == [True], "expected exact chord to trigger"

          hk._handle_event(FakeEvent(_KEYCODE_SPACE, 0))
          assert triggered == [True], "bare space must not trigger"

          hk._handle_event(FakeEvent(0x00, _DEFAULT_MODIFIER_MASK))
          assert triggered == [True], "wrong keycode must not trigger"

          hk.stop()
          print("accessibility/hotkey OK")
          PY

      - name: Configurable hotkey smoke test
        run: |
          python - <<'PY'
          import os

          from type_fast import config, hotkey

          # Human-readable spec parsing: modifiers in any order/case, exactly
          # one key.
          assert hotkey.parse_hotkey("option+command+space") == (
              hotkey._KEYCODE_SPACE, hotkey._DEFAULT_MODIFIER_MASK
          )
          assert hotkey.parse_hotkey("CTRL+Shift+t") == (
              0x11, hotkey._MOD_CONTROL | hotkey._MOD_SHIFT
          )
          assert hotkey.parse_hotkey(" opt + cmd + space ") == (
              hotkey._KEYCODE_SPACE, hotkey._DEFAULT_MODIFIER_MASK
          )

          # Invalid specs (empty, no key, multiple keys, unknown key) must
          # raise ValueError rather than silently misbehaving.
          for bad in ("", "   ", "option+command", "space+t", "option+command+zzz"):
              try:
                  hotkey.parse_hotkey(bad)
                  raise AssertionError(f"expected ValueError for {bad!r}")
              except ValueError:
                  pass

          # With no override, config.hotkey_spec() reports the default, and
          # GlobalHotkey resolves to the same keycode/modifier as before.
          assert config.hotkey_spec() == config.DEFAULT_HOTKEY
          hk = hotkey.GlobalHotkey(lambda: None)
          assert hk._keycode == hotkey._KEYCODE_SPACE
          assert hk._modifier_mask == hotkey._DEFAULT_MODIFIER_MASK
          hk.stop()

          # TYPE_FAST_HOTKEY overrides the shortcut end-to-end.
          os.environ["TYPE_FAST_HOTKEY"] = "control+shift+t"
          hk2 = hotkey.GlobalHotkey(lambda: None)
          assert hk2._keycode == 0x11
          assert hk2._modifier_mask == (hotkey._MOD_CONTROL | hotkey._MOD_SHIFT)
          hk2.stop()

          # An invalid override must never crash construction; it falls back
          # to the default shortcut instead (with a warning on stderr).
          os.environ["TYPE_FAST_HOTKEY"] = "not a valid spec"
          hk3 = hotkey.GlobalHotkey(lambda: None)
          assert hk3._keycode == hotkey._KEYCODE_SPACE
          assert hk3._modifier_mask == hotkey._DEFAULT_MODIFIER_MASK
          hk3.stop()

          del os.environ["TYPE_FAST_HOTKEY"]
          print("configurable hotkey OK")
          PY

      - name: Hotkey-hide clears stale auto-paste target
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from type_fast.app import MainWindow

          app = QApplication([])
          w = MainWindow()

          # Simulate "window visible+active, hotkey pressed again to hide":
          # the previously captured PID must be forgotten so a later,
          # non-hotkey translation session can't auto-paste into it.
          w._previous_app_pid = 12345
          w.isVisible = lambda: True
          w.isActiveWindow = lambda: True
          w._toggle_via_hotkey()
          assert w._previous_app_pid is None, "expected PID cleared on hotkey-hide"

          w._hotkey.stop()
          print("hotkey-hide clearing OK")
          PY

      - name: AX focus/injection smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from type_fast import ax_focus
          from type_fast.app import MainWindow

          # Read-only AX calls must never raise, even when untrusted (as on
          # this CI runner, which never grants Accessibility access).
          assert ax_focus.focused_element() is None
          assert ax_focus.element_bounds(None) is None
          assert ax_focus.is_value_settable(None) is False

          app = QApplication([])
          w = MainWindow()

          # Exercise MainWindow's live-injection wiring without touching real
          # Accessibility APIs, by monkeypatching ax_focus.set_value.
          calls = []
          ax_focus.set_value = lambda element, text: (calls.append((element, text)), True)[1]

          w._previous_ax_element = "fake-element"
          w._live_inject_supported = True
          w._previous_app_pid = 999  # must also be cleared once handled
          w.output.setPlainText("hello")
          assert w._live_inject_into_focused_field() is True
          assert calls == [("fake-element", "hello")]

          # Finalizing a translation via live injection must forget the
          # *entire* captured target (PID included), not just the AX fields,
          # so a later, non-hotkey translation can't act on stale state.
          w._on_finished(w._request_id, "hello")
          assert w._previous_app_pid is None
          assert w._previous_ax_element is None
          assert w._live_inject_supported is False

          w._hotkey.stop()
          print("ax_focus wiring OK")
          PY
