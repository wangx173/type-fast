name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import check
        run: python -c "import type_fast.app, type_fast.translator, type_fast.config, type_fast.hotkey; print('imports OK')"

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Headless window smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from type_fast import config, hotkey
          from type_fast.app import MainWindow
          app = QApplication([])
          w = MainWindow()
          assert w.windowTitle() == "Type Fast"
          assert w.source_lang.count() == len(config.LANGUAGES) + 1
          assert w.target_lang.count() == len(config.LANGUAGES)
          assert w.tone.count() == len(config.TONES) + 1
          assert isinstance(w.global_hotkey, hotkey.GlobalHotkey)
          assert not w.global_hotkey.is_registered  # never grabbed headless
          w.toggle_visibility()
          assert w.isVisible()
          w.dismiss()
          assert not w.isVisible()
          print("window OK")
          PY
