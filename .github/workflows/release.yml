name: Release apps

# Build the macOS .app and Windows folder and attach them to a GitHub Release on a version
# tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`). You can also run it
# manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build the .app
        run: pyinstaller --noconfirm "Type Fast.spec"

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - "dist/Type Fast.app"

      - name: Zip the .app
        run: |
          cd dist
          ditto -c -k --keepParent "Type Fast.app" "Type-Fast-macos-arm64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Type-Fast-macos-arm64
          path: dist/Type-Fast-macos-arm64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Type-Fast-macos-arm64.zip
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build the Windows app
        run: pyinstaller --noconfirm "Type Fast.spec"

      - name: Smoke test the standalone executable
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "$PWD/dist/Type Fast/Type Fast.exe" -ArgumentList '--smoke-test' -PassThru -RedirectStandardError "$env:RUNNER_TEMP/type-fast-stderr.log"
          try {
            if (-not $process.WaitForExit(15000)) {
              throw 'The standalone app did not complete its startup smoke test'
            }
            if ($process.ExitCode -ne 0) {
              Get-Content "$env:RUNNER_TEMP/type-fast-stderr.log"
              throw "The standalone app failed its startup smoke test (code $($process.ExitCode))"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -ErrorAction Stop }
            $process.Dispose()
          }

      - name: Zip the app folder
        run: Compress-Archive -Path "dist/Type Fast" -DestinationPath "dist/Type-Fast-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Type-Fast-windows-x64
          path: dist/Type-Fast-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Type-Fast-windows-x64.zip
          generate_release_notes: true
